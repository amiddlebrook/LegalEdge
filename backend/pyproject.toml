[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legaledge"
version = "1.0.0"
description = "LegalEdge - AI-powered legislative intelligence platform"
authors = [{name = "LegalEdge Team", email = "team@legaledge.com"}]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "psycopg[binary]==3.2.3",
    "asyncpg==0.30.0",
    "pydantic-settings==2.7.0",
    "loguru==0.7.2",
    "httpx==0.27.2",
    "pandas==2.2.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "pytest-cov==5.0.0",
    "pytest-xdist==3.6.1",
    "pytest-html==4.1.1",
    "pytest-benchmark==4.0.0",
    "pytest-docker==3.1.1",
    "pytest-factoryboy==2.7.0",
    "factory-boy==3.3.1",
    "responses==0.25.3",
    "freezegun==1.5.1",
    "pytest-celery==1.0.1",
    "pytest-redis==1.0.0",
    "pytest-postgresql==1.4.2",
]
load = [
    "locust==2.31.7",
]
ml = [
    "scikit-learn==1.5.2",
    "torch==2.4.1",
    "transformers==4.44.2",
    "numpy==2.1.2",
    "matplotlib==3.9.2",
]
dev = [
    "black==24.8.0",
    "isort==5.13.2",
    "flake8==7.1.1",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=app",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
    "--maxfail=5",
    "--disable-warnings",
    "--asyncio-mode=auto",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "load: Load and performance tests",
    "ml: Machine learning evaluation tests",
    "slow: Slow running tests",
    "docker: Tests requiring Docker",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "app/main.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "migrations",
]
