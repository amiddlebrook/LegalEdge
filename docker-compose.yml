version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: legaledge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Celery worker for background tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - LEGALEDGE_ENVIRONMENT=development
      - LEGALEDGE_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/legaledge
      - LEGALEDGE_REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    profiles:
      - worker

  # Optional: Celery beat scheduler
  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - LEGALEDGE_ENVIRONMENT=development
      - LEGALEDGE_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/legaledge
      - LEGALEDGE_REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    profiles:
      - worker

  # Optional: Flower monitoring interface
  flower:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - LEGALEDGE_ENVIRONMENT=development
      - LEGALEDGE_REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - worker

volumes:
  postgres_data:
  redis_data:
