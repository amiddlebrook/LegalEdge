name: LegalEdge | Cloudflare native
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate source and data adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: node --check src/index.js && node --check web/assets/app.js
      - name: Check required asset paths
        run: test -s web/index.html && test -s web/assets/styles.css
      - name: Validate Cloudflare deployment package
        run: npx --yes wrangler@4 deploy --dry-run

  deploy:
    name: Cloudflare Workers production
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare credentials are set
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
      - name: Deploy LegalEdge to Cloudflare
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify live deployment (allow DNS/edge propagation)
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Wrangler did not return a deployment URL"
            exit 1
          fi
          echo "Deployed to: $DEPLOYMENT_URL"
          echo "## LegalEdge production" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed to: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          ok=0
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$DEPLOYMENT_URL/api/health" || true)
            if [ "$code" = "200" ] && node -e "let j=require('/tmp/health.json');if(j.status!=='ok'||j.service!=='LegalEdge')process.exit(1)"; then
              echo "API smoke test passed on attempt $attempt"
              ok=1
              break
            fi
            echo "API not yet healthy: attempt $attempt, HTTP $code"
            head -c 300 /tmp/health.json 2>/dev/null || true
            echo
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Live API did not become healthy"
            exit 1
          fi
          ok=0
          for attempt in $(seq 1 10); do
            code=$(curl -L -sS --max-time 20 -o /tmp/index.html -w '%{http_code}' "$DEPLOYMENT_URL/" || true)
            if [ "$code" = "200" ] && grep -q 'LegalEdge' /tmp/index.html; then
              echo "Homepage smoke test passed on attempt $attempt"
              ok=1
              break
            fi
            echo "Homepage not ready: attempt $attempt, HTTP $code"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Homepage smoke test failed"
            exit 1
          fi
