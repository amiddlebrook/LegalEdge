name: LegalEdge CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

env:
  AWS_REGION: us-east-1
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}
  DOCKER_REPO: ${{ github.repository }}

jobs:
  # Security and Quality Checks
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Code Quality and Linting
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy bandit safety

      - name: Run backend linting
        run: |
          cd backend
          black --check --diff app/
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          mypy app/ --ignore-missing-imports
          bandit -r app/ -f json -o bandit-report.json || true
          safety check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend linting tools
        run: |
          cd frontend
          npm ci

      - name: Run frontend linting
        run: |
          cd frontend
          npm run lint
          npm run type-check || true

      - name: Upload linting reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: linting-reports
          path: |
            backend/bandit-report.json
            frontend/reports/

  # Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legaledge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-xdist

      - name: Run tests with coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/legaledge_test
          REDIS_URL: redis://localhost:6379/0

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/coverage.xml
            backend/junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  # Frontend Tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linting
        run: |
          cd frontend
          npm run lint

      - name: Run type checking
        run: |
          cd frontend
          npm run type-check || true

      - name: Run tests
        run: |
          cd frontend
          npm test -- --coverage --watchAll=false --testResultsProcessor=jest-junit

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: frontend-test-results
          path: |
            frontend/coverage/
            frontend/junit.xml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: frontend/dist/

  # Performance Tests
  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install performance testing tools
        run: |
          python -m pip install --upgrade pip
          pip install locust requests

      - name: Run API performance tests
        run: |
          cd backend
          # Run a quick performance test
          python -c "
          import asyncio
          import aiohttp
          async def test_performance():
              async with aiohttp.ClientSession() as session:
                  for i in range(100):
                      try:
                          async with session.get('http://localhost:8000/api/v1/health/status') as resp:
                              print(f'Request {i}: {resp.status}')
                      except:
                          pass
              print('Performance test completed')
          asyncio.run(test_performance())
          "

  # Database Migration Tests
  migration-test:
    name: Database Migration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legaledge_migration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install alembic

      - name: Test database migrations
        run: |
          cd backend
          export DATABASE_URL="postgresql+asyncpg://postgres:postgres@localhost:5432/legaledge_migration_test"
          alembic upgrade head
          alembic current
          # Test downgrade/upgrade cycle
          alembic downgrade -1
          alembic upgrade head
          echo "Migration tests passed"

  # Docker Build and Test
  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REPO }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and test backend image
        uses: docker/buildx/build@v3
        with:
          context: .
          dockerfile: Dockerfile.backend
          push: false
          load: true
          tags: legaledge-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test backend image
        run: |
          docker run --rm legaledge-backend:test python -c "import app; print('Backend import successful')"

      - name: Build frontend image
        uses: docker/buildx/build@v3
        with:
          context: ./frontend
          dockerfile: Dockerfile
          push: false
          load: true
          tags: legaledge-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test frontend image
        run: |
          docker run --rm legaledge-frontend:test npm run build

      - name: Build production image
        if: github.event_name != 'pull_request'
        uses: docker/buildx/build@v3
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Infrastructure Deployment
  infrastructure:
    name: Infrastructure Deployment
    runs-on: ubuntu-latest
    needs: [security-scan, docker-build, migration-test]
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'infrastructure')
    environment: ${{ inputs.environment || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "~1.6.0"

      - name: Terraform Init
        run: |
          cd infrastructure
          terraform init

      - name: Terraform Plan
        run: |
          cd infrastructure
          terraform plan -var="environment=${{ github.event.inputs.environment || 'development' }}" -out=tfplan
        env:
          TF_VAR_ssl_certificate_arn: ${{ secrets.SSL_CERTIFICATE_ARN }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cd infrastructure
          terraform apply -auto-approve tfplan

  # Application Deployment
  deploy:
    name: Application Deployment
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, docker-build, performance-test]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment != ''
    environment: ${{ inputs.environment || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          # Update ECS service with new image
          aws ecs update-service --cluster legaledge-${{ github.event.inputs.environment || 'development' }}-cluster \
                                --service legaledge-${{ github.event.inputs.environment || 'development' }}-app \
                                --task-definition legaledge-${{ github.event.inputs.environment || 'development' }}-app

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable --cluster legaledge-${{ github.event.inputs.environment || 'development' }}-cluster \
                                      --service legaledge-${{ github.event.inputs.environment || 'development' }}-app

      - name: Run health check
        run: |
          # Wait for load balancer to be healthy
          sleep 30
          curl -f https://${{ steps.get-outputs.outputs.load_balancer_dns }}/api/v1/health/status

  # Post-Deployment
  post-deploy:
    name: Post-Deployment Checks
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run smoke tests
        run: |
          # Basic health check
          curl -f https://${{ needs.deploy.outputs.load_balancer_dns }}/api/v1/health/status

          # Check API endpoints
          curl -f https://${{ needs.deploy.outputs.load_balancer_dns }}/api/v1/overview

      - name: Send deployment notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # Monitoring and Observability Setup
  observability:
    name: Observability Setup
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'production'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup CloudWatch dashboards
        run: |
          # Create CloudWatch dashboard for monitoring
          aws cloudwatch put-dashboard --dashboard-name "LegalEdge-Production" \
            --dashboard-body "$(cat monitoring/dashboard.json)"

      - name: Setup CloudWatch alarms
        run: |
          # Create CloudWatch alarms for key metrics
          aws cloudwatch put-metric-alarm --alarm-name "LegalEdge-High-CPU" \
            --alarm-description "CPU utilization is too high" \
            --metric-name CPUUtilization \
            --namespace AWS/ECS \
            --statistic Average \
            --period 300 \
            --threshold 80 \
            --comparison-operator GreaterThanThreshold \
            --evaluation-periods 2 \
            --alarm-actions ${{ secrets.SNS_TOPIC_ARN }}

      - name: Setup X-Ray tracing
        run: |
          # Configure X-Ray daemon
          echo "X-Ray tracing configured for production deployment"
